<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Algorhythm — A 3D rhythm game where AI-generated music meets your QWERTY keyboard. Hit the notes, feel the groove." />
    <title>Algorhythm 🎹</title>

    <!-- VIBE JAM 2026 — REQUIRED WIDGET — DO NOT REMOVE -->
    <script async src="https://vibej.am/2026/widget.js"></script>
    <!-- END VIBE JAM 2026 WIDGET -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Reset & Base ─────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-void:        #05040f;
        --neon-primary:   #b36bff;
        --neon-secondary: #00f5ff;
        --neon-danger:    #ff3c6e;
        --neon-gold:      #ffd166;
        --lane-inactive:  #1a1040;
        --lane-active:    #2e1f7a;
        --text-primary:   #e8e0ff;
        --text-muted:     #6b5fa8;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-void);
        color: var(--text-primary);
        font-family: 'Space Grotesk', sans-serif;
      }

      /* ── Canvas ───────────────────────────────────────────── */
      #game-canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* ── HUD overlay ──────────────────────────────────────── */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      #hud-score {
        position: absolute;
        top: 24px;
        right: 32px;
        font-family: 'Orbitron', sans-serif;
        font-size: 2rem;
        font-weight: 900;
        color: var(--neon-primary);
        text-shadow: 0 0 12px var(--neon-primary);
        letter-spacing: 0.05em;
      }

      #hud-combo {
        position: absolute;
        top: 72px;
        right: 32px;
        font-family: 'Orbitron', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: var(--neon-secondary);
        text-shadow: 0 0 8px var(--neon-secondary);
        transition: transform 0.2s ease;
      }

      #hud-combo.pop {
        transform: scale(1.25);
      }

      #hud-feedback {
        position: absolute;
        bottom: 25%;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Orbitron', sans-serif;
        font-size: 1.4rem;
        font-weight: 700;
        opacity: 0;
        transition: opacity 0.1s ease;
        text-shadow: 0 0 16px currentColor;
      }

      #hud-song {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* ── Loading splash (sprint 0 only) ──────────────────── */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-void);
        z-index: 100;
        gap: 16px;
      }

      #splash h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 900;
        color: var(--neon-primary);
        text-shadow:
          0 0 20px var(--neon-primary),
          0 0 60px var(--neon-primary),
          0 0 120px var(--neon-primary);
        letter-spacing: 0.1em;
      }

      #splash p {
        color: var(--text-muted);
        font-size: 1rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      #splash .press-key {
        margin-top: 48px;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.9rem;
        color: var(--neon-secondary);
        text-shadow: 0 0 8px var(--neon-secondary);
        animation: blink 1.4s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.2; }
      }
    </style>
  </head>

  <body>
    <!-- Splash screen -->
    <div id="splash">
      <h1>ALGORHYTHM</h1>
      <p>AI-powered rhythm · QWERTY as your piano</p>
      <span class="press-key">Press any key to continue</span>
    </div>

    <!-- Three.js render target -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-score">000000</div>
      <div id="hud-combo">COMBO x0</div>
      <div id="hud-feedback"></div>
      <div id="hud-song">Algorhythm — Loading...</div>
    </div>

    <!-- Game entry point -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
