<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Algorhythm — A 3D rhythm game where AI-generated music meets your QWERTY keyboard. Hit the notes, feel the groove." />
    <title>Algorhythm 🎹</title>

    <!-- VIBE JAM 2026 — REQUIRED WIDGET — DO NOT REMOVE -->
    <script async src="https://vibej.am/2026/widget.js"></script>
    <!-- END VIBE JAM 2026 WIDGET -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      /* ── Reset ───────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-void:        #05040f;
        --neon-primary:   #b36bff;
        --neon-secondary: #00f5ff;
        --neon-danger:    #ff3c6e;
        --neon-gold:      #ffd166;
        --text-primary:   #e8e0ff;
        --text-muted:     #6b5fa8;
      }

      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-void); color: var(--text-primary); font-family: 'Space Grotesk', sans-serif; }

      /* ── Canvas ──────────────────────────────────────────────── */
      #game-canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

      /* ── SPLASH / Main Menu ──────────────────────────────────── */
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: var(--bg-void); z-index: 100; gap: 12px;
      }
      #splash h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900;
        color: var(--neon-primary);
        text-shadow: 0 0 20px var(--neon-primary), 0 0 60px var(--neon-primary), 0 0 120px var(--neon-primary);
        letter-spacing: 0.1em;
      }
      #splash .subtitle { color: var(--text-muted); font-size: 1rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 32px; }

      /* Menu buttons */
      .menu-btn {
        font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700;
        padding: 14px 48px; border: 2px solid var(--neon-primary);
        background: transparent; color: var(--neon-primary);
        letter-spacing: 0.1em; text-transform: uppercase;
        cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden;
      }
      .menu-btn:hover { background: var(--neon-primary); color: var(--bg-void); box-shadow: 0 0 24px var(--neon-primary); }
      .menu-btn.secondary { border-color: var(--text-muted); color: var(--text-muted); font-size: 0.85rem; }
      .menu-btn.secondary:hover { background: var(--text-muted); color: var(--bg-void); box-shadow: none; }

      /* Key hint */
      .key-hint { margin-top: 24px; font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.05em; }
      .key-hint kbd { background: #1a1040; border: 1px solid var(--text-muted); border-radius: 4px; padding: 2px 8px; font-family: monospace; }

      /* ── HUD overlay ─────────────────────────────────────────── */
      #hud {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 10;
      }

      /* Score */
      #hud-score {
        position: absolute; top: 20px; right: 28px;
        font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900;
        color: var(--neon-primary); text-shadow: 0 0 12px var(--neon-primary);
        letter-spacing: 0.05em;
      }

      /* Combo */
      #hud-combo {
        position: absolute; top: 68px; right: 28px;
        font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700;
        color: var(--neon-secondary); text-shadow: 0 0 8px var(--neon-secondary);
        transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
      }
      #hud-combo.pop { transform: scale(1.4); }

      /* Hit feedback */
      #hud-feedback {
        position: absolute; bottom: 28%; left: 50%; transform: translateX(-50%);
        font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 700;
        opacity: 0; transition: opacity 0.1s ease;
        text-shadow: 0 0 16px currentColor; pointer-events: none;
      }

      /* Song name */
      #hud-song {
        position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
        font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase;
      }

      /* ── Progress bar (top) ──────────────────────────────────── */
      #hud-progress {
        position: absolute; top: 0; left: 0; width: 100%; height: 3px;
        background: rgba(179,107,255,0.15);
      }
      #hud-progress-fill {
        height: 100%; width: 0%; background: var(--neon-primary);
        box-shadow: 0 0 8px var(--neon-primary); transition: width 0.1s linear;
      }

      /* ── Life bar (vertical, left side) — GDD §3.4 ──────────── */
      #hud-life-container {
        position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 6px;
      }
      #hud-life-label {
        font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 0.1em;
        color: var(--text-muted); writing-mode: vertical-rl; text-orientation: mixed;
        transform: rotate(180deg);
      }
      #hud-life-bar {
        width: 12px; height: 200px; background: rgba(255,255,255,0.05);
        border: 1px solid rgba(179,107,255,0.3); border-radius: 6px;
        position: relative; overflow: hidden;
      }
      #hud-life-fill {
        position: absolute; bottom: 0; left: 0; width: 100%;
        height: 50%; border-radius: 6px;
        background: var(--neon-secondary);
        box-shadow: 0 0 10px var(--neon-secondary);
        transition: height 0.15s ease, background 0.3s ease, box-shadow 0.3s ease;
      }

      /* Life bar states (GDD §3.4 color rules) */
      #hud-life-bar[data-state="good"]   #hud-life-fill { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
      #hud-life-bar[data-state="mid"]    #hud-life-fill { background: var(--neon-secondary); box-shadow: 0 0 10px var(--neon-secondary); }
      #hud-life-bar[data-state="danger"] #hud-life-fill {
        background: var(--neon-danger); box-shadow: 0 0 10px var(--neon-danger);
        animation: blink-danger 0.4s ease-in-out infinite;
      }
      @keyframes blink-danger {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.35; }
      }
    </style>
  </head>

  <body>
    <!-- ── SPLASH / Main Menu ─────────────────────────────────── -->
    <div id="splash">
      <h1>ALGORHYTHM</h1>
      <p class="subtitle">AI-powered rhythm &nbsp;·&nbsp; QWERTY as your piano</p>

      <button id="btn-test-song" class="menu-btn" onclick="document.dispatchEvent(new KeyboardEvent('keydown', {key: ' '})); window.dispatchEvent(new KeyboardEvent('keydown', {code:'Space', key:' '}))">
        ▶ &nbsp;Play Test Song
      </button>

      <p class="key-hint">or press any key &nbsp;<kbd>Q–P</kbd>&nbsp; to start</p>
    </div>

    <!-- ── Three.js canvas ───────────────────────────────────────── -->
    <canvas id="game-canvas"></canvas>

    <!-- ── HUD overlay ───────────────────────────────────────────── -->
    <div id="hud">
      <!-- Top progress bar -->
      <div id="hud-progress"><div id="hud-progress-fill"></div></div>

      <!-- Score + Combo (top right) -->
      <div id="hud-score">000000</div>
      <div id="hud-combo">COMBO ×1</div>

      <!-- Hit feedback -->
      <div id="hud-feedback"></div>

      <!-- Song name (bottom center) -->
      <div id="hud-song">Algorhythm — Ready</div>

      <!-- Life bar (left side) — GDD §3.4 -->
      <div id="hud-life-container">
        <span id="hud-life-label">LIFE</span>
        <div id="hud-life-bar" data-state="mid">
          <div id="hud-life-fill"></div>
        </div>
      </div>
    </div>

    <!-- Game entry point -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
